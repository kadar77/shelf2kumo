name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:secrets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Rules and API tests against Auth/Firestore/Functions/Hosting emulators (offline demo project).
      - run: pnpm test:emulator
      # Release browser flow at 360px with headless Chrome (preinstalled on ubuntu-latest).
      - run: pnpm test:e2e
